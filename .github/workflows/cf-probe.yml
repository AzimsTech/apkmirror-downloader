name: CF Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install curl_cffi
        run: python3 -m pip install --user -q curl_cffi

      - name: Probe full chain (variants -> final URL -> ranged download)
        run: |
          bun -e '
            import { getVariants } from "./src/lib/scrapers/variants";
            import { getFinalDownloadUrl } from "./src/lib/scrapers/downloads";
            import { getFilteredVariant } from "./src/lib/helpers";
            import { execFileSync } from "node:child_process";

            const variantsUrl = "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-42-241-release/";
            const variants = await getVariants(variantsUrl);
            console.log("[1] variants:", variants.length);
            const v = getFilteredVariant(variants, { type: "apk", arch: "universal", dpi: "nodpi" });
            if (!v) throw new Error("no variant");
            console.log("[2] selected:", v.version, v.arch, v.dpi, v.type);

            const finalUrl = await getFinalDownloadUrl(v.url);
            console.log("[3] final url:", finalUrl.slice(0, 120) + "...");

            const out = execFileSync("curl", ["-s", "-L", "-r", "0-1023", "-o", "/tmp/range.bin", "-w", "%{http_code} %{size_download}", finalUrl], { encoding: "utf8" });
            console.log("[4] ranged download:", out);
          '

      - name: Challenge status of each page with plain curl (for reference)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for url in \
            "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-42-241-release/" \
            "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-42-241-release/youtube-21-42-241-android-apk-download/"; do
            code=$(curl -s -L --compressed -A "$UA" -o /tmp/b -w "%{http_code}" "$url")
            chal=$(grep -q "Just a moment" /tmp/b && echo YES || echo no)
            echo "$code challenge=$chal $url"
          done
