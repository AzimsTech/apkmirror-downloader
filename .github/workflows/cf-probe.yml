name: CF Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install curl_cffi
        run: python3 -m pip install --user -q curl_cffi

      - name: Probe full chain (real download via APKMirrorDownloader)
        run: |
          bun -e '
            import { APKMirrorDownloader } from "./src/index";
            import { readFileSync } from "node:fs";

            const { dest } = await APKMirrorDownloader.download(
              { org: "google-inc", repo: "youtube" },
              { version: "21.42.241", outDir: "/tmp", outFile: "yt-probe", arch: "universal", dpi: "nodpi", type: "apk" },
            );
            const buf = readFileSync(dest);
            console.log("[done]", dest, buf.length, "magic:", buf.subarray(0, 4).toString("hex"));
          '

      - name: Challenge status of each page with plain curl (for reference)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          for url in \
            "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-42-241-release/" \
            "https://www.apkmirror.com/apk/google-inc/youtube/youtube-21-42-241-release/youtube-21-42-241-android-apk-download/"; do
            code=$(curl -s -L --compressed -A "$UA" -o /tmp/b -w "%{http_code}" "$url")
            chal=$(grep -q "Just a moment" /tmp/b && echo YES || echo no)
            echo "$code challenge=$chal $url"
          done
